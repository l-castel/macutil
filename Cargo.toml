[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/l-castel/macutil"
authors = ["Lola Castello Puchades"]

[workspace.dependencies]
ratatui = "0.30"
crossterm = "0.29"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-io-bluetooth = "0.3"
objc2-core-wlan = "0.3"
macutil-tui-kit = { path = "crates/tui-kit" }
